name: wizard
description: Wizard - Me Lo
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.19.0
  flame_tiled: ^1.21.0
  flame_audio: ^2.10.0
  http: ^1.2.2
  shared_preferences: ^2.3.0
  wl_components:
    path: packages/wl_components

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/background/
    - assets/maps/
    - assets/maps/mossy-tileset/
    - assets/maps/mossy-tileset/slices/spikes/
    - assets/maps/mossy-tileset/slices/rocks/
    - assets/maps/mossy-tileset/slices/trunk/
    - assets/maps/mossy-tileset/slices/plants/
    - assets/maps/tilesets/
    - assets/atlas/